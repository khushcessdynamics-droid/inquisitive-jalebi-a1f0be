# OPTIONAL: applies the database migrations and deploys the user-admin Edge Function to the LIVE Supabase project.
# Runs only when started by hand (Actions > "Deploy to Supabase" > Run workflow) and only after typing DEPLOY.
# The alternative is to run the same commands from your own PC (docs/DEPLOYMENT.md, step 2B).
#
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   Secrets   SUPABASE_ACCESS_TOKEN  (Supabase > Account > Access Tokens; can be revoked at any time)
#             SUPABASE_DB_PASSWORD   (the database password chosen when the project was created)
#   Variables SUPABASE_PROJECT_REF   (the 20-letter id in https://<ref>.supabase.co)
#             APP_SITE_URL           (the website address, e.g. https://cess-machining-tracker.pages.dev)
# GitHub masks secrets in logs; none of them is printed, written to a file or sent anywhere except Supabase.
name: Deploy to Supabase

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to apply the migrations and deploy the Edge Function to the live project"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: machining-tracker
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.APP_SITE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the configuration
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF SITE_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see the comment at the top of this workflow)"; missing=1; fi
          done
          [ "$missing" = 0 ]
          [[ "$PROJECT_REF" =~ ^[a-z]{20}$ ]] || { echo "::error::SUPABASE_PROJECT_REF must be the 20-letter project id"; exit 1; }
          [[ "$SITE_URL" =~ ^https://[^/]+$ ]] || { echo "::error::APP_SITE_URL must be https://<host> with no path or trailing slash"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machining-tracker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Link the project
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations to apply (dry run)
        run: npx supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply the migrations
        run: npx supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy the user-admin Edge Function (it checks every caller itself; see supabase/config.toml)
        run: npx supabase functions deploy admin-users --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Set the Edge Function's website address (not secret)
        run: npx supabase secrets set --project-ref "$PROJECT_REF" "APP_SITE_URL=$SITE_URL" "APP_ALLOWED_ORIGINS=$SITE_URL"
      - name: Migration history on the live project
        run: npx supabase migration list --password "$SUPABASE_DB_PASSWORD"
